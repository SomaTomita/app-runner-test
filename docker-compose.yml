services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: apprunner_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d apprunner_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npx tsx watch src/server.ts"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://devuser:devpass@db:5432/apprunner_dev
      STORAGE_TYPE: local
      PORT: "3000"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./data/images:/app/data/images:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backend_node_modules:
