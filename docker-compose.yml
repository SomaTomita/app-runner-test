services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: apprunner_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d apprunner_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "[ -d node_modules/@prisma ] || npm install && npx prisma generate && npx tsx watch src/server.ts"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://devuser:devpass@db:5432/apprunner_dev
      STORAGE_TYPE: local
      PORT: "3000"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/data/images:/app/data/images:ro
    networks:
      - backend-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  backend-net:
    driver: bridge

volumes:
  pgdata:
  backend_node_modules:
