Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: horizontal
      Children:
        - User
        - AWSCloud
        - ExternalAPI

    User:
      Type: AWS::Diagram::Resource
      Preset: User

    # --- External API (Clerk) ---
    ExternalAPI:
      Type: AWS::Diagram::Resource
      Preset: ThirdPartyService
      Title: "External API (Clerk)"

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Direction: vertical
      Align: center
      Children:
        - CDNStack
        - S3Images
        - VPC

    # --- Frontend (CDN) ---
    CDNStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - CloudFront
        - S3

    CloudFront:
      Type: AWS::Diagram::Resource
      Preset: "Amazon CloudFront"
      Title: "CloudFront"

    S3:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Storage Service (Amazon S3)"
      Title: "S3"

    # --- S3 Images ---
    S3Images:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Simple Storage Service (Amazon S3)"
      Title: "S3 (Images)"

    # --- VPC ---
    VPC:
      Type: AWS::EC2::VPC
      Direction: vertical
      Children:
        - PublicSubnet
        - PrivateSubnet
      BorderChildren:
        - Position: W
          Resource: IGW

    PublicSubnet:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Children:
        - ALB
        - ECSFargate

    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer
      Title: "ALB"

    ECSFargate:
      Type: AWS::Diagram::Resource
      Preset: "AWS Fargate"
      Title: "ECS Fargate"

    PrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Children:
        - RDS

    RDS:
      Type: AWS::Diagram::Resource
      Preset: "Amazon Relational Database Service (Amazon RDS)"
      Title: "RDS"

    IGW:
      Type: AWS::EC2::InternetGateway

  Links:
    - Source: User
      Target: CloudFront
      TargetArrowHead:
        Type: Open
    - Source: User
      Target: IGW
      TargetArrowHead:
        Type: Open
    - Source: CloudFront
      Target: S3
      TargetArrowHead:
        Type: Open
    - Source: IGW
      Target: ALB
      TargetArrowHead:
        Type: Open
    - Source: ALB
      Target: ECSFargate
      TargetArrowHead:
        Type: Open
    - Source: ECSFargate
      Target: RDS
      TargetArrowHead:
        Type: Open
    - Source: ECSFargate
      Target: S3Images
      TargetArrowHead:
        Type: Open
      Labels:
        TargetRight:
          Title: "S3 Gateway Endpoint"
    - Source: ECSFargate
      Target: ExternalAPI
      TargetArrowHead:
        Type: Open
